name: Build and Publish Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: UChat
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --name="UChat" --windowed --noconfirm --clean main.py

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build Windows Installer with Inno Setup
        shell: powershell
        run: |
          $isccPath = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Path
          if (-not $isccPath) {
            if (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
              $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
            } elseif (Test-Path "C:\Program Files\Inno Setup 6\ISCC.exe") {
              $isccPath = "C:\Program Files\Inno Setup 6\ISCC.exe"
            }
          }
          & "$isccPath" packaging/installer_windows.iss

      - name: Upload Windows Setup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: UChat/release_dist/UChat_Setup_v1.0.exe

  create-release:
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Linux Release Archive
        run: |
          tar -czvf UChat_Linux_v0.1.0.tar.gz install.sh uninstall.sh README.md LICENSE UChat/

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: ./

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          prerelease: true
          files: |
            UChat_Setup_v1.0.exe
            UChat_Linux_v0.1.0.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}